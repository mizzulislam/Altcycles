name: Altcycles CI Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, PostgreSQL PGlite Tests, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)" \
            fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Activate pre-installed Node.js 22 on runner
        shell: bash
        run: |
          set -euo pipefail
          NODE22_BIN="$(ls -d /opt/hostedtoolcache/node/22.*/x64/bin 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "${NODE22_BIN}" ]]; then
            echo "${NODE22_BIN}" >> "${GITHUB_PATH}"
            export PATH="${NODE22_BIN}:${PATH}"
          fi
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit and PostgreSQL integration tests (Fase 1-4)
        run: npm test

      - name: Build production SPA bundle
        run: npm run build
